[package]
name = "shadcn-rs-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "CLI installer for shadcn-rs components (egui + iced)"
readme = "README.md"

include = [
    "src/**/*",
    "Cargo.toml",
    "/README.md",
    "LICENSE*",
]

[[bin]]
name = "shadcn-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
toml_edit = "0.23"
