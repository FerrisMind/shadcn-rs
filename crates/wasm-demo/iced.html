<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iced Demo - Shadcn-rs</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="iced_demo" data-wasm-opt="0" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            overflow: hidden;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            margin: 0;
            padding: 0;
            background-color: #09090b;
        }
    </style>
</head>
<body>
    <script>
        (function () {
            function enforceCanvasSize() {
                const canvases = Array.from(document.querySelectorAll("canvas"));
                if (canvases.length === 0) return;

                const targetW = Math.max(1, Math.floor(window.innerWidth));
                const targetH = Math.max(1, Math.floor(window.innerHeight));

                canvases.forEach(function (c) {
                    c.style.position = "fixed";
                    c.style.left = "0";
                    c.style.top = "0";
                    c.style.width = "100vw";
                    c.style.height = "100vh";
                    c.style.display = "block";
                    c.style.backgroundColor = "#09090b";

                    if (c.width !== targetW) c.width = targetW;
                    if (c.height !== targetH) c.height = targetH;
                });
            }

            window.addEventListener("TrunkApplicationStarted", function () {
                enforceCanvasSize();
            });

            setInterval(function () {
                enforceCanvasSize();
            }, 2000);

            window.addEventListener("resize", function () {
                enforceCanvasSize();
            });
        })();
    </script>
</body>
</html>
