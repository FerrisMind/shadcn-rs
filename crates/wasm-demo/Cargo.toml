[package]
name = "wasm-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iced-shadcn = { path = "../iced-shadcn" }
egui-shadcn = { path = "../egui-shadcn" }

# Common
log = "0.4"
env_logger = "0.11"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3.82", features = ["Window", "Document", "HtmlCanvasElement"] }
lucide-icons = "0.575.0"

# Iced WASM specific
iced = { version = "0.14", features = ["canvas", "webgl", "fira-sans"] }

# Egui WASM specific
eframe = { version = "0.33", default-features = false, features = ["web_screen_reader", "wgpu"] }

[[bin]]
name = "iced_demo"
path = "src/bin/iced_demo.rs"

[[bin]]
name = "egui_demo"
path = "src/bin/egui_demo.rs"
