[package]
name = "shadcn-common"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Shared shadcn design tokens for iced-shadcn and egui-shadcn, built on twill"
documentation = "https://docs.rs/shadcn-common"
keywords = ["shadcn", "theme", "design-tokens", "twill", "gui"]
categories = ["gui"]

include = [
    "src/**/*",
    "assets/**/*",
    "Cargo.toml",
    "/README.md",
    "LICENSE*",
]

[dependencies]
twill-core = { workspace = true }

[features]
default = []
## Bundle TTF font faces (Geist, Inter, Instrument Serif, JetBrains Mono).
fonts = []

[dev-dependencies]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
