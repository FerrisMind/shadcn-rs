[package]
name = "egui-shadcn"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shadcn-inspired component kit for egui"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egui-shadcn"
keywords = ["egui", "ui", "components", "shadcn", "radix"]
categories = ["gui", "visualization", "rendering::graphics-api", "game-development"]

include = [
    "src/**/*",
    "Cargo.toml",
    "/README.md",
    "LICENSE*",
]

[dependencies]
egui = "0.33"
log = { workspace = true }
lucide-icons = "0.575"
chrono = "0.4"
regex = "1.11"
egui_plot = { version = "0.34", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
env_logger = { workspace = true }
eframe = "0.33"
rfd = "0.16"

[build-dependencies]
winres = "0.1"

[features]
plot = ["egui_plot"]

[[example]]
name = "command_dialog"
path = "examples/command/dialog.rs"
