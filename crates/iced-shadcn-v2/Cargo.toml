[package]
name = "iced-shadcn-v2"
# Own semver: new crate (post v0.5.0 tag, never on crates.io). Not the
# workspace 0.5 line shared by iced-shadcn / egui-shadcn / shadcn-common.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Builder-first shadcn-inspired component kit for iced (v2 API)"
documentation = "https://docs.rs/iced-shadcn-v2"
keywords = ["iced", "ui", "components", "shadcn", "radix"]
categories = ["gui", "visualization", "rendering::graphics-api"]

include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "/README.md",
    "LICENSE*",
]

[dependencies]
chorale-core = { workspace = true, optional = true }
iced_core = { version = "0.14", default-features = false, features = ["advanced"] }
iced_widget = { version = "0.14", default-features = false, features = ["advanced", "canvas"] }
iced_renderer = { version = "0.14", default-features = false, optional = true }
emojis = { version = "0.9", optional = true }
shadcn-common = { workspace = true }
twill-core = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
rfd = { version = "0.16", optional = true }

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "image", "wgpu", "tiny-skia", "thread-pool", "tokio", "x11", "wayland"] }

[features]
default = ["wgpu", "tiny-skia", "fonts", "core"]

wgpu = ["iced_widget/wgpu"]
tiny-skia = [
    "dep:iced_renderer",
    "iced_renderer/tiny-skia",
    "iced_renderer/x11",
    "iced_renderer/wayland",
]
## Bundle TTF font faces from `shadcn-common` (`ALL_FACES`, Geist, Inter, …).
fonts = ["shadcn-common/fonts"]
## iced `image` widget support (pulled by `data` for Avatar).
image = ["iced_widget/image"]

## --- Category features (API grouping; no heavy crates except forms→regex / data→image) ---

## Primitives: button, spinner, card, typography, scroll_area, accordion, snippet, …
core = []
## Inputs and form controls (includes regex validators via shadcn-common/forms).
forms = ["core", "shadcn-common/forms"]
## Dialogs, menus, popovers, command, combobox, pm_command, …
overlays = ["core", "forms"]
## Breadcrumb, tabs, sidebar, carousel, … (sidebar needs forms + overlays).
navigation = ["core", "forms", "overlays"]
## Table, chart, calendar, avatar, tree_view, … (includes image for Avatar).
data = ["core", "forms", "overlays", "image"]
## Sonner toasts.
feedback = ["core"]
## File drop zone (native picker is separate `rfd`).
file-drop = ["core"]

## --- Heavy / niche features ---

## Password suite + zxcvbn.
password = ["forms", "shadcn-common/password"]
## Phone input + phonelib (auto-enables forms + overlays).
phone = ["forms", "overlays", "shadcn-common/phone"]
## Emoji picker + `emojis` crate.
emoji-picker = ["forms", "overlays", "dep:emojis"]
## Code block + tree-sitter highlighter.
syntax = ["core", "shadcn-common/syntax"]
## Data table + chorale-core.
data-table = ["data", "dep:chorale-core", "shadcn-common/data-table"]
## Native file dialogs for FileDropZone.
rfd = ["dep:rfd", "file-drop"]
serde = ["dep:serde", "shadcn-common/serde"]

## Every category + heavy feature.
full = [
    "core",
    "forms",
    "overlays",
    "navigation",
    "data",
    "feedback",
    "file-drop",
    "password",
    "phone",
    "emoji-picker",
    "syntax",
    "data-table",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

