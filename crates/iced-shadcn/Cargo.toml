[package]
name = "iced-shadcn"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Shadcn-inspired component kit for iced"
documentation = "https://docs.rs/iced-shadcn"
keywords = ["iced", "ui", "components", "shadcn", "radix"]
categories = ["gui", "visualization", "rendering::graphics-api", "game-development"]

include = [
    "src/**/*",
    "assets/**/*",
    "Cargo.toml",
    "/README.md",
    "LICENSE*",
]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "highlighter", "image", "svg", "tokio", "wgpu", "tiny-skia", "lazy", "x11", "wayland"] }
iced_wgpu = { version = "0.14", optional = true, default-features = false }
lucide-icons = { version = "0.575", features = ["iced"] }
num-traits = "0.2"
regex = "1.10"
shadcn-common = { workspace = true }
twill = { git = "https://github.com/FerrisMind/twill.git", rev = "83e8ac1a00766b5304ec88d25a9f3e99274ef0e8", features = ["iced"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "dds", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "webp"] }
rfd = { version = "0.16", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
tracy-client = { version = "0.18", optional = true, default-features = false, features = ["enable", "ondemand", "only-localhost"] }
wry = { version = "0.54.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[dev-dependencies]
rfd = "0.16"

[features]
default = []
chrono = ["dep:chrono"]
charts = []
profile-tracing = ["dep:tracing", "dep:tracing-subscriber"]
profile-tracy = ["dep:tracy-client"]
rfd = ["dep:rfd"]
web-colors = ["dep:iced_wgpu", "iced/web-colors", "iced_wgpu/web-colors"]
wry = ["dep:gtk", "dep:wry"]

[[example]]
name = "web-preview"
path = "examples/web-preview/main.rs"
required-features = ["wry"]
