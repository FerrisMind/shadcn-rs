[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]

yanked = "deny"

unmaintained = "all" 

ignore = [
    # paste is archived (RUSTSEC-2024-0436) and currently comes transitively via wgpu/image stack.
    # No safe direct upgrade path is available at the moment.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",        
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "BSL-1.0",            # Boost Software License — clipboard-win, error-code
    "CC0-1.0",            # Creative Commons Zero — hexf-parse (wgpu dep)
]

confidence-threshold = 0.8

unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
