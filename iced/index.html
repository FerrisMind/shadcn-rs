<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iced Demo - Shadcn-rs</title>
    
<script type="module">
import init, * as bindings from '/shadcn-rs/iced/iced_demo.js';
const wasm = await init({ module_or_path: '/shadcn-rs/iced/iced_demo_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            overflow: hidden;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            margin: 0;
            padding: 0;
            background-color: #09090b;
        }
    </style>
<link rel="modulepreload" href="/shadcn-rs/iced/iced_demo.js" crossorigin="anonymous" integrity="sha384-nQYKOSFa6Bo2XAgmKXR7IW/fHPmvKtHSf4pV9JIRVB21GoII/GqkpNhNCL0kkkxN"><link rel="modulepreload" href="/shadcn-rs/iced/snippets/wasm-demo-5a88ff8df96022bc/inline0.js" crossorigin="anonymous" integrity="sha384-GPBUQ4muOZ9NJJ9kv9xnW9Xa2RRm877Opbr+Mf/0Qwmh/9Kv1ZXPPQ/NwIYbqVam"><link rel="preload" href="/shadcn-rs/iced/iced_demo_bg.wasm" crossorigin="anonymous" integrity="sha384-4NCYjbvk951IXgCHEZGjXrzEUKpFsK3aiSJlhUlIQ3CsfDg7O3w3YA/jGdl0VJuO" as="fetch" type="application/wasm"></head>
<body>
    <script>
        (function () {
            function enforceCanvasSize() {
                const canvases = Array.from(document.querySelectorAll("canvas"));
                if (canvases.length === 0) return;

                const targetW = Math.max(1, Math.floor(window.innerWidth));
                const targetH = Math.max(1, Math.floor(window.innerHeight));

                canvases.forEach(function (c) {
                    c.style.position = "fixed";
                    c.style.left = "0";
                    c.style.top = "0";
                    c.style.width = "100vw";
                    c.style.height = "100vh";
                    c.style.display = "block";
                    c.style.backgroundColor = "#09090b";

                    if (c.width !== targetW) c.width = targetW;
                    if (c.height !== targetH) c.height = targetH;
                });
            }

            window.addEventListener("TrunkApplicationStarted", function () {
                enforceCanvasSize();
            });

            setInterval(function () {
                enforceCanvasSize();
            }, 2000);

            window.addEventListener("resize", function () {
                enforceCanvasSize();
            });
        })();
    </script>
</body>
</html>
